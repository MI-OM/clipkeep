name: Draft Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Check release version
        run: npm run release:check
      - name: Build MSI and NSIS installers
        run: npm run tauri build -- --bundles msi,nsis
      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installerFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi", "src-tauri/target/release/bundle/nsis" -File
          if (-not $installerFiles) { throw "No installer files were produced." }
          $installerFiles | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
          } | Set-Content -Path SHA256SUMS.txt -Encoding ascii
      - name: Attach installers to a draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
